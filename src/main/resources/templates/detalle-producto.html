<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title th:text="${producto.titulo} + ' - innovAR'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-ml { background-color: #fff159; }
        .img-detalle { max-height: 450px; object-fit: contain; width: 100%; border-radius: 8px; }
        .precio-detalle { font-size: 2rem; font-weight: 700; color: #2b2b2b; }
    </style>
</head>
<body class="bg-light" style="overflow-x: hidden;">

    <!-- Header / Navbar -->
    <nav class="navbar navbar-ml mb-4 shadow-sm py-2">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold text-dark fs-3 m-0" href="/">innovAR</a>
            <a href="/" class="btn btn-outline-dark btn-sm fw-semibold">← Volver al Catálogo</a>
        </div>
    </nav>

    <div class="container my-4">
        <div class="card shadow-sm border-0 p-3 p-md-4">
            <div class="row g-4 align-items-center">
                
                <!-- Columna Izquierda: Imagen Completa -->
                <div class="col-md-6 text-center bg-white p-3 rounded">
                    <img th:if="${producto.imagenUrl != null}" 
                         th:src="@{${p.imagenUrl}}" 
                         class="img-fluid img-detalle shadow-sm" 
                         th:alt="${producto.titulo}">
                    
                    <img th:if="${producto.imagenUrl == null}" 
                         src="https://via.placeholder.com/400x300?text=Sin+Imagen" 
                         class="img-fluid img-detalle">
                </div>

                <!-- Columna Derecha: Detalles del Producto centrados verticalmente -->
                <div class="col-md-6 d-flex flex-column justify-content-center h-100">
                    <span class="badge bg-secondary mb-2 align-self-start" th:text="${producto.categoria}">Categoría</span>
                    <!-- Ejemplo de renderizado seguro con Thymeleaf -->
                        <h1 th:text="${producto?.titulo}">Nombre del producto</h1>
                        <p th:text="${producto?.descripcion}">Descripción...</p>
                        <span th:text="${'$' + producto?.precio}">$0.00</span>

                        <!-- Imagen con ruta segura -->
                        <img th:src="${producto?.imagenUrl}" class="img-fluid" th:alt="${producto?.titulo}">

                    <!-- Formulario de Agregar al Carrito -->
                    <form th:action="@{/carrito/agregar/{id}(id=${producto.id})}" method="post" class="mt-2">
                        
                        <!-- Bloque de Cantidad Centrado en Línea Horizontal -->
                        <div class="d-flex align-items-center gap-3 mb-4">
                            <label class="fw-semibold m-0 fs-6">Cantidad:</label>
                            
                            <div class="input-group m-0" style="max-width: 140px;">
                                <button class="btn btn-outline-secondary fw-bold px-3" type="button" onclick="cambiarCantidadDetalle(-1)">-</button>
                                <input type="number" id="inputCantidadDetalle" name="cantidad" value="1" min="1" max="99" class="form-control text-center fw-bold">
                                <button class="btn btn-outline-secondary fw-bold px-3" type="button" onclick="cambiarCantidadDetalle(1)">+</button>
                            </div>
                        </div>

                        <!-- Botones de Acción -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-dark btn-lg w-100 fw-semibold shadow-sm">
                                🛒 Agregar al Carrito
                            </button>

                            <a th:href="@{'https://api.whatsapp.com/send?phone=5491112345678&text=Hola!%20Quiero%20comprar/consultar%20por%20el%20producto:%20' + ${producto.titulo}}" 
                               target="_blank" 
                               class="btn btn-success btn-lg w-100 fw-semibold shadow-sm mt-1">
                                Consultar por WhatsApp 💬
                            </a>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Script JS para los botones + / - del detalle -->
    <script>
        function cambiarCantidadDetalle(delta) {
            const input = document.getElementById('inputCantidadDetalle');
            let valorActual = parseInt(input.value) || 1;
            valorActual += delta;
            if (valorActual < 1) valorActual = 1;
            if (valorActual > 99) valorActual = 99;
            input.value = valorActual;
        }
    </script>

        <!-- Pie de página (Footer) -->
    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <!-- Enlace a Instagram -->
            <div class="mb-2">
                <a href="https://www.instagram.com/i.nnovar/?hl=es-la" target="_blank" rel="noopener noreferrer" class="text-white text-decoration-none fs-5 d-inline-flex align-items-center gap-2">
                    <i class="bi bi-instagram text-warning fs-4"></i>
                    <span class="fw-semibold">Síguenos en Instagram</span>
                </a>
            </div>
            <!-- Leyenda de Derechos Reservados -->
            <p class="text-secondary small m-0">
                © 2026 - todos los derechos reservados
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
