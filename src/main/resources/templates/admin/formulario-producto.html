<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestión de Producto - innovAR Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .img-preview {
            max-height: 160px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>
<body class="bg-light" style="overflow-x: hidden;">

    <!-- Navbar del Admin -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3 mb-md-4 shadow-sm py-2">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold fs-4 m-0" href="/admin/productos">innovAR Admin</a>
            <a href="/admin/productos" class="btn btn-outline-light btn-sm fw-semibold">← Volver</a>
        </div>
    </nav>

    <div class="container my-3 my-md-4 px-3" style="max-width: 650px;">
        
        <div class="card shadow-sm border-0 p-3 p-sm-4 rounded-4">
            
            <!-- Título del Formulario -->
            <div class="border-bottom pb-3 mb-3">
                <h3 class="fw-bold m-0 fs-4 text-dark" th:text="${producto.id == null ? '➕ Nuevo Producto' : '✏️ Editar Producto'}">
                    Gestión de Producto
                </h3>
                <small class="text-muted">Completa los datos para publicar o actualizar el producto en la tienda.</small>
            </div>

            <form th:action="@{/admin/productos/guardar}" th:object="${producto}" method="post" enctype="multipart/form-data">
                
                <input type="hidden" name="id" th:value="${producto.id}">

                <!-- Título del Producto -->
                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary small">Título del Producto</label>
                    <input type="text" 
                           name="titulo" 
                           th:value="${producto.titulo}" 
                           class="form-control form-control-lg fs-6" 
                           required 
                           placeholder="Ej. Taza sublimada personalizada">
                </div>

                <!-- Categoría -->
                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary small">Categoría</label>
                    <select name="categoria" th:value="${producto.categoria}" class="form-select form-select-lg fs-6">
                        <option value="Sublimación" th:selected="${producto.categoria == 'Sublimación'}">Sublimación</option>
                        <option value="Fotos" th:selected="${producto.categoria == 'Fotos'}">Fotos</option>
                        <option value="Stickers" th:selected="${producto.categoria == 'Stickers'}">Stickers</option>
                        <option value="Personalizados" th:selected="${producto.categoria == 'Personalizados'}">Personalizados</option>
                    </select>
                </div>

                <!-- Precio -->
                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary small">Precio ($)</label>
                    <div class="input-group input-group-lg">
                        <span class="input-group-text fw-bold">$</span>
                        <input type="number" 
                               step="0.01" 
                               name="precio" 
                               th:value="${producto.precio}" 
                               class="form-control fs-6" 
                               required 
                               placeholder="0.00">
                    </div>
                </div>

                <!-- Descripción -->
                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary small">Descripción</label>
                    <textarea name="descripcion" 
                              th:text="${producto.descripcion}" 
                              class="form-control fs-6" 
                              rows="3" 
                              placeholder="Detalla las características, medidas o especificaciones..."></textarea>
                </div>

                <!-- Imagen del Producto -->
                <div class="mb-4">
                    <label class="form-label fw-semibold text-secondary small">Imagen del Producto</label>
                    
                    <!-- Muestra imagen actual si existe -->
                    <div th:if="${producto.imagenUrl != null}" class="mb-2 text-center bg-white p-2 border rounded">
                        <small class="d-block text-muted mb-1">Imagen actual:</small>
                        <img th:src="${producto.imagenUrl}" class="img-preview shadow-sm" alt="Vista previa">
                    </div>

                    <input type="file" name="file" class="form-control form-control-lg fs-6" accept="image/*">
                    <small class="text-muted d-block mt-1" style="font-size: 0.75rem;">
                        Formatos soportados: JPG, PNG, WEBP.
                    </small>
                </div>

                <!-- Botones de Acción (Apilados en celular, lado a lado en tablet/escritorio) -->
                <div class="d-flex flex-column flex-sm-row justify-content-end gap-2 pt-2 border-top">
                    <a href="/admin/productos" class="btn btn-outline-secondary btn-lg fw-semibold order-2 order-sm-1">
                        Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm order-1 order-sm-2">
                        💾 Guardar Producto
                    </button>
                </div>

            </form>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
